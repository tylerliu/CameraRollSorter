name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.0.app/Contents/Developer

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: xcode-27
    timeout-minutes: 20
    strategy:
      # Report each platform independently; a macOS failure shouldn't hide iOS.
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            destination: generic/platform=iOS Simulator
          - platform: macOS
            destination: generic/platform=macOS

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Show toolchain
        run: xcodebuild -version

      - name: Build app for ${{ matrix.platform }}
        run: |
          set -o pipefail
          xcodebuild \
            -project CameraRollSorter.xcodeproj \
            -scheme CameraRollSorter \
            -configuration Debug \
            -destination '${{ matrix.destination }}' \
            -derivedDataPath "$RUNNER_TEMP/CameraRollSorter-build" \
            CODE_SIGNING_ALLOWED=NO \
            build

  checks:
    name: Logic checks
    runs-on: xcode-27
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Run grouping checks
        run: |
          xcrun swiftc \
            CameraRollSorter/Models/SequenceGrouping.swift \
            CameraRollSorter/Models/SimilarityGrouping.swift \
            CameraRollSorter/Models/IncrementalSimilarityGrouping.swift \
            Tests/main.swift \
            -o "$RUNNER_TEMP/CameraRollSorter-grouping-checks"
          "$RUNNER_TEMP/CameraRollSorter-grouping-checks"

      - name: Run blurry photo checks
        run: |
          xcrun swiftc \
            CameraRollSorter/Services/BlurSensitivity.swift \
            CameraRollSorter/Features/Shared/PhotoSelectionLogic.swift \
            Tests/BlurryPhotoChecks.swift \
            -o "$RUNNER_TEMP/CameraRollSorter-blurry-checks"
          "$RUNNER_TEMP/CameraRollSorter-blurry-checks"
